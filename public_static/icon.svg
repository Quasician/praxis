<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2550"/>
      <stop offset=".4" stop-color="#3a3478"/>
      <stop offset=".66" stop-color="#8a5592"/>
      <stop offset=".82" stop-color="#e8875f"/>
      <stop offset="1" stop-color="#f8bf70"/>
    </linearGradient>
    <radialGradient id="glow" cx="128" cy="200" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd58a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffd58a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#sky)"/>
    <rect width="256" height="256" fill="url(#glow)"/>
    <!-- the day's arc -->
    <path d="M34 204 A94 94 0 0 1 222 204" fill="none" stroke="#fff" stroke-opacity=".32" stroke-width="6" stroke-dasharray="0.1 15" stroke-linecap="round"/>
    <!-- faint stars -->
    <g fill="#fff" fill-opacity=".6">
      <circle cx="38" cy="54" r="3"/><circle cx="104" cy="34" r="2.4"/><circle cx="226" cy="118" r="2.8"/><circle cx="216" cy="26" r="2.2"/><circle cx="30" cy="118" r="2.8"/>
    </g>
    <!-- constellation: progress toward a milestone -->
    <g transform="translate(-6 0)"><path d="M58 120 L90 80 L130 96 L172 50 L204 70" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#fff">
      <circle cx="58" cy="120" r="8"/><circle cx="90" cy="80" r="9"/><circle cx="130" cy="96" r="8"/><circle cx="204" cy="70" r="6.5" fill-opacity=".8"/>
    </g>
    <!-- the goal star -->
    <path d="M172 28 L179 43 L194 50 L179 57 L172 72 L165 57 L150 50 L165 43 Z" fill="#fff0c8"/></g>
    <!-- the rising sun -->
    <circle cx="128" cy="204" r="40" fill="#ffc55e"/>
    <!-- low city: taller at the sides, open in the middle -->
    <path d="M0 256 V164 H18 V152 H32 V172 H46 V140 H64 V178 H80 V190 H96 V204 H160 V190 H176 V178 H192 V140 H210 V172 H224 V152 H238 V164 H256 V256 Z" fill="#1b1733"/>
    <g fill="#ffcf86" fill-opacity=".85">
      <rect x="51" y="150" width="5" height="6"/><rect x="200" y="150" width="5" height="6"/><rect x="51" y="164" width="5" height="6"/><rect x="200" y="164" width="5" height="6"/><rect x="22" y="164" width="5" height="6"/><rect x="229" y="164" width="5" height="6"/>
    </g>
  </g>
  <rect x="2" y="2" width="252" height="252" rx="54" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="4"/>
</svg>
