# Publishes a new Praxis release whenever main gets a new version number.
#
# Bump "version" in package.json and push to main: this tags the commit (v1.2.3),
# builds the Windows installer and publishes it to GitHub Releases, where installed
# copies pick it up within about half an hour. Pushes that don't change the version
# don't release anything. Pushing a v* tag yourself, or Run workflow, also works.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Is this a new version?
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"            # a tag pushed by hand
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # 4.3: nothing is published until the app has been clicked through: the main screens, the rituals, the canvas.
  app-check:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run check:app

  windows:
    needs: [version, app-check]
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Tag the version
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          tag="${{ needs.version.outputs.tag }}"
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null && exit 0
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
      # Create the release up front, as a draft. Without this, electron-builder's parallel
      # uploads each create a release and the files end up split across duplicates.
      # Installed copies don't see drafts, so they never pick up a half-uploaded release.
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.version.outputs.tag }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --verify-tag --title "${tag#v}" --notes "Praxis ${tag#v}. Installed copies update automatically."
      - name: Build and upload installer
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.version.outputs.tag }}" --draft=false --latest
