# Type-checks and builds on every push, so problems show up before a release.
name: Check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The wallpaper's helper only runs on Windows: build it and check it is a windowed program that answers.
  windows-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:node
      - name: Test the wallpaper helper
        shell: powershell
        run: ./scripts/test-wallpaper-helper.ps1
